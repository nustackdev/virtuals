name: Test PyPI Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g., 0.1.0). Leave empty for latest.'
        required: false
        default: ''

jobs:
  smoke_test:
    name: Smoke test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install package from PyPI
        run: |
          python -m pip install --upgrade pip
          if [ -z "${{ inputs.version }}" ]; then
            pip install virtuals-binary-codec
          else
            pip install virtuals-binary-codec==${{ inputs.version }}
          fi

      - name: Show installed version
        run: |
          python -c "from virtuals_binary_codec import BinaryKeyCodec; print('imported ok')"
          pip show virtuals-binary-codec

      - name: Smoke test
        run: |
          python << 'EOF'
          from virtuals_binary_codec import BinaryKeyCodec

          codec = BinaryKeyCodec()

          # Basic encode/decode
          key = ("users", 42, "profile")
          encoded = codec.encode(key)
          decoded = codec.decode(encoded)
          assert decoded == key, f"Expected {key}, got {decoded}"
          print(f"  encode/decode: {key} -> {len(encoded)} bytes -> {decoded}")

          # Negative integers
          key = ("balance", -100)
          assert codec.decode(codec.encode(key)) == key
          print(f"  negative int: {key}")

          # Lexicographic ordering
          k1 = ("a",)
          k2 = ("b",)
          assert (k1 < k2) == (codec.encode(k1) < codec.encode(k2))
          print("  ordering preserved")

          # Mixed types
          key = ("data", 0, "nested", 999)
          assert codec.decode(codec.encode(key)) == key
          print(f"  mixed types: {key}")

          print("\nAll smoke tests passed!")
          EOF
