name: Publish virtuals-py to PyPI

on:
  push:
    tags:
      - 'py-v*'  # e.g. py-v0.1.0
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual upload)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: virtuals-py-dist
          path: dist/*
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/virtuals-py/

    permissions:
      id-token: write  # OIDC for Trusted Publisher
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: virtuals-py-dist
          path: dist

      - name: List distributions
        run: |
          ls -lh dist/
          echo "Wheels: $(ls -1 dist/*.whl 2>/dev/null | wc -l)"
          echo "Sdist: $(ls -1 dist/*.tar.gz 2>/dev/null | wc -l)"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN - Skipping PyPI upload"
          ls -lh dist/
